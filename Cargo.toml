[package]
name = "hteam"
version = "0.2.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive", "cargo"] }
clap_complete = "4"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
dirs = "5"
config = "0.14"
rustyline = { version = "15", features = ["with-file-history"] }
inquire = "0.7"
tabled = { version = "0.16" }
colored = "2"
regex = "1"
scraper = "0.22"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
anyhow = "1"
thiserror = "1"
toml = "0.8"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

[dev-dependencies]
mockito = "1"
tempfile = "3"
