---
name: Test Build (temporal)

on:
  push:
    branches:
      - test/release-matrix
  workflow_dispatch: {}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          mkdir -p dist
          strip "target/${{ matrix.target }}/release/hteam" \
            -o "dist/hteam-${{ matrix.name }}"
          file "dist/hteam-${{ matrix.name }}"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hteam-${{ matrix.name }}
          path: dist/hteam-${{ matrix.name }}
          retention-days: 3
